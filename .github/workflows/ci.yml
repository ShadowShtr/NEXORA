name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-with-minimum-length

  integration:
    # NEX-015: the RLS/isolation suite under tests/integration/ needs a real Postgres +
    # PostgREST + Auth boundary, not mocks — it exists to catch policy regressions a unit
    # test can't. Runs against a fresh local Supabase stack (Docker, native on
    # ubuntu-latest) instead of the shared cloud dev project, so it's deterministic and
    # never touches real/shared data (ADR-007: local dev lacks Docker, CI doesn't).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - name: Run integration tests against local Supabase
        # `supabase status -o env` values come back quoted (godotenv format) — eval'ing
        # them under `set -a` exports each one correctly for this step's child process
        # (npm/vitest) instead of round-tripping through $GITHUB_ENV, where the literal
        # quote characters would end up baked into the value.
        env:
          NEXT_PUBLIC_APP_URL: https://example.invalid
        run: |
          set -a
          eval "$(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=TEST_DATABASE_URL)"
          set +a
          npm run test:integration

  e2e-critical:
    name: E2E crítico
    # NEX-178: tests/e2e/** (Playwright) never ran in CI before this job — verify/
    # integration only cover lint/types/build/unit and vitest-against-local-Supabase, so
    # a real client-side bug in the public booking flow merged straight to main via
    # #135 with a green check. Gated on verify+integration passing first since it's the
    # slowest job (real build + browser + local Supabase).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, integration]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - name: Build production bundle and run @critical E2E suite against local Supabase
        # Same `supabase status -o env` eval pattern as the integration job above. Build
        # runs against a real production bundle (`next build` + `next start`, see
        # playwright.config.ts webServer) rather than `next dev`, to match what Vercel
        # actually serves instead of a dev-only code path.
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          # 32 bytes hex, generated for this job only — not a production secret, see
          # BOOKING_DRAFT_ENCRYPTION_KEY in src/lib/env.ts / .env.example.
          BOOKING_DRAFT_ENCRYPTION_KEY: bf6e8cc7482ccc0ca0885e56a8a242e8a55d41980dc95544b3664ed961c37339
          CI: 'true'
        run: |
          set -a
          eval "$(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SERVICE_ROLE_KEY)"
          set +a
          npm run build
          npm run test:e2e:critical
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
