name: Dependency Review

# Trigger manual apenas: a action requer GitHub Advanced Security + Dependency
# graph, indisponíveis em repositórios privados de conta pessoal (ver
# docs/evidence/NEX-003_GITHUB_REPO_SETUP.md). Reativar `pull_request:` se o
# repositório passar a público ou a conta adquirir GHAS.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
