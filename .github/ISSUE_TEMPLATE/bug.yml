name: Bug
about: Reportar comportamento incorreto
labels: ['type:bug']
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto em dados, agenda ou financeiro
